/* Layout: full-bleed WebGL plate; HUD is a specimen-sheet overlay pinned to the four corners, trackers float over 3D objects. */
:root{

html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;transition:background-color .9s}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}

.corner{position:absolute;font-family:var(--f-label);font-weight:500;font-size:clamp(11px,1.02vw,15px);letter-spacing:.07em;text-transform:uppercase;line-height:1}

<script type="module">
import * as THREE from 'three';

/* ───────────────────────── utilities ───────────────────────── */
const V3 = THREE.Vector3, TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const damp = (k, dt) => 1 - Math.exp(-k * dt);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry32(20261013);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const UP = new V3(0, 1, 0);
const tmpV = new V3(), tmpV2 = new V3(), tmpQ = new THREE.Quaternion(), tmpM = new THREE.Matrix4();

/* wind: gust fronts roll across the meadow along +x (about 3 m/s, one every 18 s) */
const WIND_DIR = new V3(1, 0, .3).normalize();
const WIND_AXIS = new V3().crossVectors(UP, WIND_DIR).normalize();
const gust = (x, z, t) => Math.pow(Math.max(0, Math.sin(t * .35 - x * .11 - z * .05)), 3);

/* ───────────────────────── renderer ───────────────────────── */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 1);
const maxDpr = Math.min(window.devicePixelRatio || 1, 1.6);
let dpr = maxDpr;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.03, 500);
const U = {
  time: { value: 0 }, fadeStart: { value: 16 }, fade: { value: .05 },
  focus: { value: 15 }, focusRange: { value: 3 }, dofAmt: { value: 1 },
};

/* ───────────────────────── shaders ───────────────────────── */
const NOISE = `
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s; }`;
// Focus as light: intensity is split into sharp / soft / very-soft channels by distance from the focus plane.
const DOF = `
uniform float uFocus, uFocusRange, uDofAmt, uFadeStart, uFade;
vec3 dofSplit(float I, float dist){
  float c = clamp(abs(dist - uFocus) / max(uFocusRange, 1e-3), 0., 3.) * uDofAmt;
  float w0 = 1. - smoothstep(.35, 1.1, c);
  float w2 = smoothstep(1.1, 2.4, c);
  float fade = exp(-max(0., dist-uFadeStart)*uFade) * smoothstep(.06,.5,dist);
  return I * fade * vec3(w0, max(0., 1.-w0-w2), w2);
}`;
const dofUniforms = () => ({ uFocus: U.focus, uFocusRange: U.focusRange, uDofAmt: U.dofAmt, uFadeStart: U.fadeStart, uFade: U.fade });
const ADD = { transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false };

const XRAY_VS = `
uniform float uTime, uWind;
varying vec3 vN, vV, vUv3, vLocal; varying float vDist;
#ifdef USE_PETAL
attribute vec3 aUV;
#endif
void main(){
  vec3 p = position; vec3 n = normal; vUv3 = vec3(0.);
#ifdef USE_PETAL
  vUv3 = aUV;
  p += n * (sin(uTime*1.4 + aUV.z*6.283 + aUV.y*2.5) + .5*sin(uTime*3.1 + aUV.z*11. + aUV.x*3.)) * .022 * aUV.y*aUV.y * uWind;
#endif
  vLocal = p;
#ifdef USE_INSTANCING
  vec4 wp = modelMatrix * instanceMatrix * vec4(p,1.);
  vec3 wn = mat3(modelMatrix) * mat3(instanceMatrix) * n;
#else
  vec4 wp = modelMatrix * vec4(p,1.);
  vec3 wn = mat3(modelMatrix) * n;
#endif
  vN = normalize(wn);
  vec3 tc = cameraPosition - wp.xyz; vDist = length(tc); vV = tc / max(vDist,1e-4);
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const XRAY_FS = `
uniform float uBase,uFres,uPow,uVein,uVeinN,uEdge,uOpacity,uBands,uRim;
varying vec3 vN, vV, vUv3, vLocal; varying float vDist;
${NOISE}
${DOF}
void main(){
  vec3 N = normalize(vN), V = normalize(vV);
  float F = pow(1. - abs(dot(N,V)), uPow);
  float I = uBase + F*uFres;
#ifdef USE_PETAL
  float s=vUv3.x, v=vUv3.y, sd=vUv3.z;
  float w = vnoise(vec2(s*2.5+sd*13., v*3.5)) - .5;
  float ang = s*uVeinN + w*.9 + s*v*.6;
  float vein = pow(abs(cos(ang*3.14159)), 26.);
  float vein2 = pow(abs(cos((ang*2.+w)*3.14159)), 50.)*.45;
  float veins = (vein+vein2) * smoothstep(0.,.2,v) * (1.-.5*v);
  float mid = exp(-s*s*60.) * (1.-v) * .9;
  float edge = smoothstep(.84,1.,abs(s))*.6 + smoothstep(.9,1.,v)*.6;
  float tex = .7 + .6*vnoise(vec2(s*8.+sd*7., v*20.));
  I = uBase*tex + F*uFres + (veins+mid)*uVein + edge*uEdge*(.4+F);
  I *= mix(.15, 1., smoothstep(.04, .48, v));
#endif
#ifdef USE_BANDS
  float b = abs(fract(vLocal.z*uBands+.5)-.5)*2.;
  I += smoothstep(.72,1.,b)*.16 + F*.08;
#endif
#ifdef USE_RIM
  I += smoothstep(-.12, 0., vLocal.z) * uRim;
#endif
  gl_FragColor = vec4(dofSplit(I*uOpacity, vDist), 1.);
}`;

function xray(o = {}) {
  const defines = {};
  if (o.petal) defines.USE_PETAL = '';
  if (o.bands) defines.USE_BANDS = '';
  if (o.rim) defines.USE_RIM = '';
  return new THREE.ShaderMaterial({
    defines,
    uniforms: {
      uTime: U.time, ...dofUniforms(),
      uWind: { value: o.wind ?? 1 }, uBase: { value: o.base ?? .04 }, uFres: { value: o.fres ?? .7 },
      uPow: { value: o.pow ?? 2 }, uVein: { value: o.vein ?? .1 }, uVeinN: { value: o.veinN ?? 6 },
      uEdge: { value: o.edge ?? .25 }, uOpacity: { value: o.opacity ?? 1 }, uBands: { value: o.bands ?? 0 }, uRim: { value: o.rim ?? 0 },
    },
    vertexShader: XRAY_VS, fragmentShader: XRAY_FS, ...ADD, side: THREE.DoubleSide,
  });
}
// lines (hair, seed heads, grids): per-vertex intensity attribute aC
function lineMat(op = 1) {
  return new THREE.ShaderMaterial({
    uniforms: { uOp: { value: op }, ...dofUniforms() },
    vertexShader: `attribute float aC; varying float vC; varying float vDist;
      void main(){ vC=aC; vec4 wp=modelMatrix*vec4(position,1.); vDist=distance(wp.xyz,cameraPosition); gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader: `uniform float uOp; varying float vC; varying float vDist; ${DOF}
      void main(){ gl_FragColor=vec4(dofSplit(vC*uOp, vDist),1.); }`,
    ...ADD,
  });
}
function lineGeo(pos, col) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aC', new THREE.Float32BufferAttribute(col, 1));
  return g;
}

/* merge indexed geometries that share attribute layout */
function mergeGeos(geos) {
  const names = Object.keys(geos[0].attributes);
  let nv = 0, ni = 0;
  for (const g of geos) { nv += g.attributes.position.count; ni += g.index.count; }
  const out = new THREE.BufferGeometry(), arrs = {};
  for (const n of names) arrs[n] = new Float32Array(nv * geos[0].attributes[n].itemSize);
  const idx = new Uint32Array(ni);
  let ov = 0, oi = 0;
  for (const g of geos) {
    for (const n of names) arrs[n].set(g.attributes[n].array, ov * g.attributes[n].itemSize);
    const ia = g.index.array;
    for (let i = 0; i < ia.length; i++) idx[oi + i] = ia[i] + ov;
    ov += g.attributes.position.count; oi += ia.length; g.dispose();
  }
  for (const n of names) out.setAttribute(n, new THREE.BufferAttribute(arrs[n], geos[0].attributes[n].itemSize));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  out.computeBoundingSphere();
  return out;
}

/* ───────────────────────── petal geometry ───────────────────────── */
function petalGeometry(o, rnd, SU = 22, SV = 18) {
  const { len, wid, cup, curl, ruf } = o;
  const seed = rnd();
  const pos = [], uv = [], idx = [];
  const nf1 = 5 + rnd() * 6, nf2 = 11 + rnd() * 8, ph1 = rnd() * TAU, ph2 = rnd() * TAU;
  const notch = .02 + rnd() * .06, skew = (rnd() - .5) * .25;
  for (let j = 0; j <= SV; j++) {
    const v = j / SV;
    const wp = wid * Math.pow(Math.sin(Math.PI * Math.min(1, .04 + v * .7)), .85);
    for (let i = 0; i <= SU; i++) {
      const s = i / SU * 2 - 1;
      const x = s * wp + skew * v * v * wid;
      let y = len * v - len * .28 * s * s * Math.pow(v, 4);
      y -= len * notch * Math.abs(Math.sin(s * nf1 + ph1)) * Math.pow(v, 6);
      let z = -cup * wid * .6 * s * s * Math.sqrt(v) + curl * len * .35 * v * v;
      z += ruf * wid * .07 * Math.sin(s * nf2 + ph2 + v * 4) * Math.pow(v, 2.5);
      z += ruf * wid * .05 * Math.sin(v * 9 + ph1 + s * 3) * v;
      pos.push(x, y, z); uv.push(s, v, seed);
    }
  }
  for (let j = 0; j < SV; j++) for (let i = 0; i < SU; i++) {
    const a = j * (SU + 1) + i, b = a + 1, c = a + SU + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aUV', new THREE.Float32BufferAttribute(uv, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ───────────────────────── peony ───────────────────────── */
function ringDefs(kind) {
  if (kind === 'bud') return [
    { n: 5, len: .9, wid: .62, tilt: .05, cup: .9, curl: -.5, r: .05, ruf: .4 },
    { n: 6, len: 1.05, wid: .72, tilt: .14, cup: .85, curl: -.45, r: .08, ruf: .4 },
    { n: 5, len: 1.15, wid: .8, tilt: .26, cup: .8, curl: -.35, r: .1, ruf: .3 }];
  return [
    { n: 7, len: .7, wid: .42, tilt: .42, cup: .55, curl: -.35, r: .36, ruf: 1.2 },
    { n: 9, len: .95, wid: .55, tilt: .55, cup: .5, curl: -.2, r: .4, ruf: 1.1 },
    { n: 10, len: 1.25, wid: .72, tilt: .72, cup: .45, curl: -.05, r: .44, ruf: 1 },
    { n: 10, len: 1.6, wid: .9, tilt: .92, cup: .4, curl: .08, r: .48, ruf: .9 },
    { n: 9, len: 1.95, wid: 1.08, tilt: 1.12, cup: .34, curl: .18, r: .52, ruf: .8 },
    { n: 8, len: 2.3, wid: 1.25, tilt: 1.32, cup: .28, curl: .28, r: .55, ruf: .7 },
    { n: 6, len: 2.55, wid: 1.38, tilt: 1.5, cup: .22, curl: .38, r: .56, ruf: .6 }];
}
const leafGeos = [], stemGeos = [];
const sharedStem = xray({ base: .022, fres: .62, pow: 2.0 });
const sharedLeaf = xray({ petal: true, base: .015, fres: .36, pow: 2.2, vein: .13, veinN: 3, edge: .22 });

function buildPeony(o) {
  const rnd = mulberry32(o.seed);
  const group = new THREE.Group();
  group.position.copy(o.pos);
  const axis = o.axis.clone().normalize();
  group.quaternion.setFromUnitVectors(UP, axis);
  group.rotateY(rnd() * TAU);
  group.scale.setScalar(o.scale);
  const baseQ = group.quaternion.clone();
  const op = o.opacity ?? 1;
  const mat = o.live
    ? xray({ petal: true, base: .009, fres: .4, pow: 2.7, vein: .1, veinN: 6, edge: .3, opacity: op })
    : xray({ petal: true, base: .007, fres: .31, pow: 2.5, vein: .08, veinN: 6, edge: .23, opacity: op });
  const petals = [], geos = [];
  const defs = ringDefs(o.kind);
  defs.forEach((d, ri) => {
    const off = rnd() * TAU;
    for (let k = 0; k < d.n; k++) {
      const th = off + k / d.n * TAU + (rnd() - .5) * .35;
      const j = .85 + rnd() * .3;

    reads: () => [['field', '64 × 49 m'], ['peonies', flowers.length], ['wind', fmt(1.2 + gust(0, 0, U.time.value) * 2.4, 1) + ' m/s'], ['visits', flowers.reduce((a, f) => a + f.visits, 0)], ['kVp', kvp()]],
  },
  {
    name: 'NECTAR', sub: 'anther · filament · pollen grain Ø 42 µm', dur: 20, fov: 42, fade: [5.5, .15], exp: .46, glyph: .32,
    enter: () => { bee1.lock = A; bee1.stay = true; if (!(bee1.state === 'feed' && bee1.flower === A)) bee1.setOnFlower(A); },
    leave: () => { bee1.lock = null; bee1.stay = false; bee1.timer = 2; },
    shot: (τ) => {
      const up = A.up, c = beeHead(bee1).clone();
      const side = new V3(1, 0, 0).applyQuaternion(A.group.quaternion).applyAxisAngle(up, .9 + τ * .07);
      return { pos: c.clone().addScaledVector(up, 1.55 - τ * .018).addScaledVector(side, 2.5), tgt: c };
    },
    focus: () => camDist(beeHead(bee1)), range: 1.15, dof: 1,
    light: () => bee1.pos,
    trackers: () => [
      { get: grainWorld(3), r: .06, min: 14, max: 60, lines: ['pollen.grain', 'Ø 42 µm', 'exine: echinate'], lag: 7 },
      { get: () => drops[0].getWorldPosition(new V3()), r: .06, min: 14, max: 60, lines: ['nectar', 'sucrose 38 %', 'droplet 0.4 µL'], kind: 'pin', lag: 7 },
      { get: () => bee1.pos, r: 1.2, max: 145, lines: ['object (1)', 'bee.obj', () => bee1.label(), () => `corbicula ${fmt(bee1.bee.load * 100, 0)} %`], lag: 6 },
    ],
    reads: () => [['magnification', '× 24'], ['anthers', A.anthers.length], ['grains', grainN], ['proboscis', '6.4 mm'], ['pollen', fmt(bee1.bee.load * 15, 1) + ' mg']],
  },
  {
    name: 'THE HIVE', sub: 'cell Ø 5.4 mm · wax wall 0.07 mm · 120° joints', dur: 22, fov: 38, fade: [14, .045], exp: .84, glyph: .7,
    shot: (τ) => { const u = τ / 22; return { pos: H.clone().add(new V3(lerp(-4.5, 3.5, easeIO(u)), .9 + Math.sin(u * 3) * .6, 8.4 - Math.sin(u * Math.PI) * 2.4)), tgt: H.clone().add(new V3(lerp(-2.6, 2, u), -.3, 0)) }; },
    focus: () => camDist(tmpV.copy(H).add(new V3(0, 0, .3))), range: 2.8, dof: 1,
    light: () => H,
    trackers: () => [
      { get: workerWorld(dancer), r: .6, lines: ['object (7)', 'forager', 'waggle run', () => dancer.waggling ? 'dancing 13 Hz' : 'return loop', '1 s ≈ 1 km'] },
      { get: () => hive.localToWorld(new V3(honeyPinCell.x, honeyPinCell.y, 0)), r: .3, min: 14, lines: ['cell 0412', 'capped honey', 'water 17 %'], kind: 'pin' },
      { get: () => { const c = hive.userData.larva[6]; return hive.localToWorld(new V3(c.x, c.y, 0)); }, r: .3, min: 14, lines: ['larva', 'day 4', 'fed 1 300 ×/day'], lag: 8 },
    ],
    links: [[0, 2]],
    reads: () => [['cells', '≈ 2 400'], ['temp', '34.5 °C'], ['humidity', '62 %'], ['dance angle', '52° off vertical'], ['workers', workers.length], ['kVp', kvp()]],
  },
  {
    name: 'SWARM', sub: 'n = 900 · formation morph', dur: 18, fov: 40, fade: [30, .02], exp: .95, glyph: .6,
    enter: () => { swarm.shape = 0; swarm.from = 0; swarm.timer = 0; swarm.k = 1; },
    shot: (τ) => { const a = Math.sin(τ * .18) * .32; return { pos: S.clone().add(new V3(Math.sin(a) * 15, 1.8 + Math.sin(τ * .22) * 1.4, Math.cos(a) * 15)), tgt: S.clone() }; },
    focus: () => camDist(S) - 2.0, range: 5.5, dof: .75,
    light: () => S,
    trackers: () => [
      { get: () => swarmCentroid, r: 6, max: 210, lines: ['swarm', 'n = 900', () => 'form: ' + SHAPES[swarm.shape]], lag: 4 },
      { get: () => swarmGroup.localToWorld(tmpV2.copy(swarm.pos[451])), r: .5, lines: ['bee 0451', () => `v ${fmt(swarm.vel[451].length() * 1.2, 1)} m/s`] },
    ],
    links: [[1, 0]],
    reads: () => [['altitude', '28 m'], ['bees', SWN], ['form', SHAPES[swarm.shape]], ['wingbeat', '230 Hz'], ['kVp', kvp()]],
  },
];
let chIdx = -1, chT = 0, auto = true;
const camState = { pos: new V3(), tgt: new V3(), fov: 34, focus: 15 };
let trans = null;
function goChapter(i, fromUser = false, first = false) {
  if (i === chIdx) return;
  if (chIdx >= 0 && CH[chIdx].leave) CH[chIdx].leave();
  const from = { pos: camState.pos.clone(), tgt: camState.tgt.clone(), fov: camState.fov };
  chIdx = i; chT = 0; readTick = 0;
  const ch = CH[i]; if (ch.enter) ch.enter();
  const to = ch.shot(0);
  const dist = from.pos.distanceTo(to.pos);
  trans = first ? null : { from, t: 0, dur: clamp(1.5 + dist * .022, 1.7, 3.2), lift: Math.min(dist * .1, 6.5) };
  if (!first) post.uniforms.uPulse.value = 1;
  buildHud(ch);
  document.getElementById('cIx').textContent = `${String(i + 1).padStart(2, '0')} / ${String(CH.length).padStart(2, '0')}`;
  scramble(document.getElementById('cNm'), ch.name, 750, true);
  document.getElementById('cSb').textContent = ch.sub;
  const card = document.getElementById('card'); card.classList.remove('hide');
  clearTimeout(card._t); card._t = setTimeout(() => card.classList.add('hide'), 4200);
  document.querySelectorAll('#timeline button').forEach((b, j) => b.classList.toggle('on', j === i));
  if (fromUser) { auto = false; document.getElementById('bAuto').classList.remove('on'); }
}

/* ───────────────────────── interaction ───────────────────────── */
const orbit = { yaw: 0, pitch: 0, zoom: 1, drag: false, lx: 0, ly: 0, idle: 99 };
canvas.addEventListener('pointerdown', e => { orbit.drag = true; orbit.lx = e.clientX; orbit.ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!orbit.drag) return;
  orbit.yaw -= (e.clientX - orbit.lx) * .004; orbit.pitch = clamp(orbit.pitch - (e.clientY - orbit.ly) * .003, -.7, .7);
  orbit.lx = e.clientX; orbit.ly = e.clientY; orbit.idle = 0;
});
addEventListener('pointerup', () => orbit.drag = false);
canvas.addEventListener('wheel', e => { e.preventDefault(); orbit.zoom = clamp(orbit.zoom * Math.exp(e.deltaY * .001), .45, 2.2); orbit.idle = 0; }, { passive: false });
let paused = false, asciiOn = true;
const toggle = (id, on) => document.getElementById(id).classList.toggle('on', on);
document.getElementById('bAuto').onclick = () => { auto = !auto; toggle('bAuto', auto); };
document.getElementById('bAscii').onclick = () => { asciiOn = !asciiOn; toggle('bAscii', asciiOn); };
document.getElementById('bPause').onclick = () => { paused = !paused; toggle('bPause', paused); };
document.getElementById('bHud').onclick = () => { const h = document.getElementById('hud'); h.classList.toggle('off'); toggle('bHud', h.classList.contains('off')); };
document.getElementById('bFull').onclick = () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => { }); } catch (e) { }
};
addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= MODES.length) setMode(n - 1);
  const k = e.key.toLowerCase();
  if (k === 'm') setMode((modeIdx + 1) % MODES.length);
  if (k === 'arrowright') goChapter((chIdx + 1) % CH.length, true);
  if (k === 'arrowleft') goChapter((chIdx + CH.length - 1) % CH.length, true);
  if (k === 's') document.getElementById('bAuto').click();
  if (k === 'a') document.getElementById('bAscii').click();
  if (k === 'p') document.getElementById('bPause').click();
  if (k === 'h') document.getElementById('bHud').click();
  if (k === 'f') document.getElementById('bFull').click();
});
const modesEl = document.getElementById('modes');
MODES.forEach((m, i) => {
  const b = document.createElement('button'); b.className = 'mb'; b.title = `${m.name} (${i + 1})`;
  b.innerHTML = `<span class="sw"><b style="background:${m.a}"></b><b style="background:${m.b}"></b><b style="background:${m.c}"></b></span><span class="nm2">${m.name.toUpperCase()}</span>`;
  b.onclick = () => setMode(i); modesEl.appendChild(b);
});
const tlEl = document.getElementById('timeline');
CH.forEach((c, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span>${String(i + 1).padStart(2, '0')} ${c.name}</span><i></i>`;
  b.onclick = () => goChapter(i, true); tlEl.appendChild(b);
});

/* ───────────────────────── sizing ───────────────────────── */
let W = 1, Hh = 1;
function resize() {
  W = innerWidth; Hh = innerHeight;
  renderer.setPixelRatio(dpr); renderer.setSize(W, Hh, false);
  const w = Math.max(2, Math.floor(W * dpr)), h = Math.max(2, Math.floor(Hh * dpr));
  rtScene.setSize(w, h);
  rtA.setSize(w >> 2, h >> 2); rtB.setSize(w >> 2, h >> 2);
  rtC.setSize(w >> 3, h >> 3); rtD.setSize(w >> 3, h >> 3);
  post.uniforms.uRes.value.set(w, h);
  camera.aspect = W / Hh; camera.updateProjectionMatrix();
  pixU.value = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
  trackers.forEach(t => t.lw = 0);
  const meta = document.getElementById('meta').getBoundingClientRect(), foot = document.getElementById('foot').getBoundingClientRect();
  safe = { top: 68, bottom: Math.max(200, foot.top - 14), metaL: W > 760 ? meta.left : W, metaB: meta.bottom };
}
addEventListener('resize', resize);

/* ───────────────────────── loop ───────────────────────── */
const date = document.getElementById('date'), clock = document.getElementById('clock'), readsEl = document.getElementById('reads');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const sph = new THREE.Spherical(), lightV = new V3();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = clamp((now - last) / 1000, 0, .05); last = now;
  perfAcc += dt; perfN++;
  if (perfAcc > 2) {
    const avg = perfAcc / perfN;
    if (avg > 1 / 42 && dpr > .7) { dpr = Math.max(.7, dpr - .15); resize(); }
    else if (avg < 1 / 57 && dpr < maxDpr) { dpr = Math.min(maxDpr, dpr + .1); resize(); }
    perfAcc = 0; perfN = 0;
  }
  const sdt = paused ? 0 : dt * (reduced ? .6 : 1);
  simT += sdt; wallT += dt; U.time.value = simT;
  frames++;

  chT += sdt;
  const ch = CH[chIdx];
  if (auto && chT > ch.dur) goChapter((chIdx + 1) % CH.length);
  document.querySelectorAll('#timeline button i').forEach((el, j) => el.style.setProperty('--p', j === chIdx ? clamp(chT / CH[chIdx].dur, 0, 1) : 0));

  // world
  const open = clamp(simT / 6, 0, 1);
  for (const f of flowers) f.update(simT, sdt, f === A ? open : 1);
  for (const b of gardenBees) b.update(sdt, simT);
  updatePollen(sdt, simT);
  for (let i = 0; i < grainN; i++) {
    const g = grains[i];
    tmpV.copy(g.p).add(new V3(Math.sin(simT * g.sp + g.ph) * .03, Math.sin(simT * g.sp * .7 + g.ph * 2) * .04, Math.cos(simT * g.sp + g.ph) * .03));
    g.rot.x += sdt * g.sp; g.rot.y += sdt * g.sp * .6;
    grainIM.setMatrixAt(i, tmpM.compose(tmpV, tmpQ.setFromEuler(g.rot), new V3(g.s, g.s, g.s)));
  }
  grainIM.instanceMatrix.needsUpdate = true;
  const nearHive = camState.pos.distanceTo(H) < 75, nearSwarm = camState.pos.distanceTo(S) < 78;
  hive.visible = nearHive || !!trans;
  if (nearHive || trans) updateHive(sdt, simT);
  swarmGroup.visible = nearSwarm || !!trans;
  updateSwarm(sdt, simT, nearSwarm || !!trans);
  if (nearSwarm || trans) { swarmCentroid.set(0, 0, 0); for (let i = 0; i < SWN; i += 9) swarmCentroid.add(swarm.pos[i]); swarmCentroid.multiplyScalar(9 / SWN); swarmGroup.localToWorld(swarmCentroid); }

  // camera rig
  const shot = ch.shot(chT);
  orbit.idle += dt;
  if (!orbit.drag && orbit.idle > 4) { orbit.yaw *= 1 - damp(.6, dt); orbit.pitch *= 1 - damp(.6, dt); orbit.zoom = lerp(orbit.zoom, 1, damp(.4, dt)); }
  const aspectF = camera.aspect < 1 ? Math.pow(1 / camera.aspect, .75) : 1;
  const off = shot.pos.clone().sub(shot.tgt); sph.setFromVector3(off);
  sph.theta += orbit.yaw; sph.phi = clamp(sph.phi + orbit.pitch, .15, 2.95); sph.radius *= orbit.zoom * aspectF;
  const want = shot.tgt.clone().add(new V3().setFromSpherical(sph));
  let transK = 1;
  if (trans) {
    trans.t += dt;
    const k = easeIO(clamp(trans.t / trans.dur, 0, 1)); transK = k;
    const p0 = trans.from.pos, p3 = want;
    const p1 = p0.clone().add(new V3(0, trans.lift * .2, trans.lift * 1.4)), p2 = p3.clone().add(new V3(0, trans.lift * .2, trans.lift * 1.4));
    const u = 1 - k;
    camState.pos.set(0, 0, 0).addScaledVector(p0, u * u * u).addScaledVector(p1, 3 * u * u * k).addScaledVector(p2, 3 * u * k * k).addScaledVector(p3, k * k * k);
    camState.tgt.lerpVectors(trans.from.tgt, shot.tgt, easeIO(clamp(trans.t / trans.dur * 1.05, 0, 1)));
    const midBell = 4 * k * (1 - k) * clamp((p0.distanceTo(p3) - 10) / 24, 0, 1);
    if (midBell > 0) {
      camState.pos.lerp(new V3(0, 1.4, 13), midBell * .65);
      camState.tgt.lerp(new V3(0, -1.2, -5), midBell * .82);
    }
    camState.fov = lerp(trans.from.fov, ch.fov, k);
    if (trans.t >= trans.dur) trans = null;
  } else {
    camState.pos.lerp(want, damp(2.5, dt));
    camState.tgt.lerp(shot.tgt, damp(3, dt));
    camState.fov = lerp(camState.fov, ch.fov, damp(2, dt));
  }
  camera.position.copy(camState.pos);
  const hh = (reduced || orbit.drag) ? 0 : 1;
  camera.position.x += (Math.sin(wallT * .7) * .6 + Math.sin(wallT * 1.1 + 1) * .4) * .012 * hh;
  camera.position.y += (Math.sin(wallT * .53 + 2) * .6 + Math.sin(wallT * .9 + 4) * .4) * .01 * hh;
  camera.lookAt(camState.tgt);
  camera.rotateZ(Math.sin(wallT * .31) * .0009 * hh);
  if (Math.abs(camera.fov - camState.fov) > .01) { camera.fov = camState.fov; camera.updateProjectionMatrix(); pixU.value = Math.floor(Hh * dpr) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)); }
  camera.updateMatrixWorld();
  const dTgt = camera.position.distanceTo(camState.tgt);
  const wantFadeStart = trans ? Math.max(ch.fade[0], dTgt + 18) : ch.fade[0];
  const wantFade = trans ? Math.min(ch.fade[1], .02) : ch.fade[1];
  U.fadeStart.value = lerp(U.fadeStart.value, wantFadeStart, trans ? 1 : damp(2, dt));
  U.fade.value = lerp(U.fade.value, wantFade, trans ? 1 : damp(2, dt));
  // focus: follows the scene's subject; racks over about 0.8 s; opens up during flights between scenes
  const fTarget = trans ? dTgt : ch.focus();
  camState.focus = lerp(camState.focus, fTarget, trans ? 1 : damp(3.2, dt));
  U.focus.value = camState.focus;
  U.focusRange.value = lerp(U.focusRange.value, trans ? Math.max(ch.range * 2.4, 9.5) : ch.range, trans ? 1 : damp(3, dt));
  U.dofAmt.value = lerp(U.dofAmt.value, ch.dof * (trans ? .65 : 1), damp(3, dt));

  // post params
  const m = MODES[modeIdx], pu = post.uniforms;
  const effExp = trans ? lerp(.95, ch.exp, transK * transK) : ch.exp;
  if (modeT < 1) { modeT = Math.min(1, modeT + dt / 1.3); pu.uMix.value = easeIO(modeT); }
  pu.uGrain.value = lerp(pu.uGrain.value, m.grain, damp(3, dt));
  pu.uScan.value = lerp(pu.uScan.value, m.scan, damp(3, dt));
  pu.uAberr.value = lerp(pu.uAberr.value, m.aberr, damp(3, dt));
  pu.uHalf.value = lerp(pu.uHalf.value, m.half, damp(3, dt));
  pu.uExposure.value = lerp(pu.uExposure.value, m.exp * effExp, damp(3, dt));
  pu.uAscii.value = lerp(pu.uAscii.value, asciiOn ? 1 : 0, damp(4, dt));
  pu.uGlyphCap.value = lerp(pu.uGlyphCap.value, ch.glyph, damp(2, dt));
  pu.uCell.value = m.cell * dpr;
  pu.uPulse.value *= 1 - damp(2.2, dt);
  pu.uFadeIn.value = Math.min(1, pu.uFadeIn.value + dt / 2.5);
  toScreen(lightV.copy(ch.light()), tmpV);
  if (tmpV.z < 1) { pu.uLightPos.value.x = lerp(pu.uLightPos.value.x, tmpV.x / W, damp(2, dt)); pu.uLightPos.value.y = lerp(pu.uLightPos.value.y, 1 - tmpV.y / Hh, damp(2, dt)); }

  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  blurMat.uniforms.tIn.value = rtScene.texture; blurMat.uniforms.uDir.value.set(1.5 / rtA.width, 0); pass(blurMat, rtA);
  blurMat.uniforms.tIn.value = rtA.texture; blurMat.uniforms.uDir.value.set(0, 1.5 / rtA.height); pass(blurMat, rtB);
  blurMat.uniforms.tIn.value = rtB.texture; blurMat.uniforms.uDir.value.set(2 / rtC.width, 0); pass(blurMat, rtC);
  blurMat.uniforms.tIn.value = rtC.texture; blurMat.uniforms.uDir.value.set(0, 2 / rtC.height); pass(blurMat, rtD);
  pass(post, null);

  readTick -= dt;
  if (readTick <= 0) {
    readTick = .25;
    const d = new Date();
    date.textContent = `${MON[d.getMonth()]} ${d.getDate()}`;
    clock.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    readsEl.innerHTML = ch.reads().map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('') + `<div><span>frame</span><b>${String(frames).padStart(6, '0')}</b></div>`;
  }
  updateHud(dt);
}

/* ───────────────────────── boot ───────────────────────── */
let saved = 0;
try { saved = parseInt(localStorage.getItem('bees-waggle-mode') || '0', 10) || 0; } catch (e) { }
resize();
const fontsReady = document.fonts ? Promise.race([document.fonts.load('400 40px "Azeret Mono"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.catch(() => { }).finally(() => {
  setMode(clamp(saved, 0, MODES.length - 1), true);
  goChapter(0, false, true);
  const s0 = CH[0].shot(0); camState.pos.copy(s0.pos); camState.tgt.copy(s0.tgt);
  resize();
  requestAnimationFrame(frame);
});
</script>
