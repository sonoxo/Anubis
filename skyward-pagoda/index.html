<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>天空の塔 · Skyward Pagoda</title>
    <script type="module" crossorigin src="./assets/index-B8Fz2E78.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DjJlCU8G.css">
  </head>
  <body>
    <div id="canvas-container"></div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-inner">
        <svg class="enso-loader" viewBox="0 0 120 120" width="84" height="84">
          <defs>
            <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#e8dcc8" stop-opacity="0.95" />
              <stop offset="65%" stop-color="#c8462f" stop-opacity="0.85" />
              <stop offset="100%" stop-color="#d9b25f" stop-opacity="0.2" />
            </linearGradient>
          </defs>
          <circle
            class="enso-ring"
            cx="60"
            cy="60"
            r="44"
            fill="none"
            stroke="url(#inkGrad)"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-dasharray="235 45"
          />
          <!-- Mini Isometric Voxel Seal inside Enso -->
          <g transform="translate(60, 60)">
            <polygon points="0,-16 14,-8 0,0 -14,-8" fill="#e8dcc8" opacity="0.9" />
            <polygon points="-14,-8 0,0 0,16 -14,8" fill="#b8ad9e" opacity="0.85" />
            <polygon points="0,0 14,-8 14,8 0,16" fill="#c8462f" opacity="0.85" />
          </g>
        </svg>
        <div class="loading-jp">天空の塔</div>
        <div class="loading-en">SKYWARD PAGODA</div>
        <div class="loading-bar-track">
          <div id="loading-bar-fill" class="loading-bar-fill"></div>
        </div>
        <div id="loading-status" class="loading-status">Sculpting floating archipelago…</div>
      </div>
    </div>

    <!-- Cinematic Intro Title Card -->
    <div id="intro-card" class="intro-card hidden">
      <div class="intro-seal">印</div>
      <h1 class="intro-title-jp">天空の塔</h1>
      <div class="intro-divider"></div>
      <h2 class="intro-title-en">SKYWARD PAGODA</h2>
      <p class="intro-subtitle">Sanctuary of the Floating Clouds</p>
    </div>

    <!-- Main HUD UI -->
    <div id="ui-root" class="ui-root" data-tod="day">
      <!-- Top-left Brand Header -->
      <header class="ui-header glass-panel">
        <div class="brand-row">
          <span class="brand-seal">塔</span>
          <div class="brand-text">
            <div class="brand-title">
              <span class="brand-jp">天空の塔</span>
              <span class="brand-dot">·</span>
              <span class="brand-en">Skyward Pagoda</span>
            </div>
            <div class="brand-line"></div>
            <div class="brand-sub" id="ui-subtitle">SANCTUARY ARCHIPELAGO · CLEAR SKY</div>
          </div>
        </div>
      </header>

      <!-- Bottom-center Time-of-Day Dock & Collapsible Places Popover -->
      <nav class="ui-bottom-dock" id="ui-bottom-dock">
        <!-- Collapsible Points of Interest Popover (hidden by default; shown on Places toggle or hover) -->
        <div class="poi-bar glass-panel" id="poi-bar" aria-hidden="true">
          <div class="poi-chips" id="poi-chips">
            <button class="poi-chip active" data-poi="overview">Archipelago</button>
            <button class="poi-chip" data-poi="pagoda">Pagoda</button>
            <button class="poi-chip" data-poi="waterfall">Waterfall</button>
            <button class="poi-chip" data-poi="sakura">Sakura</button>
            <button class="poi-chip" data-poi="bridge">Bridges</button>
            <button class="poi-chip" data-poi="lake">Mirror Lake</button>
            <button class="poi-chip" data-poi="peak">Hermit Peak</button>
            <button class="poi-chip" data-poi="underside">Root Caverns</button>
          </div>
        </div>

        <!-- Single Slim Centered Time of Day Dial & Slider -->
        <div class="tod-bar glass-panel">
          <button
            id="btn-autocycle"
            class="icon-btn tod-play-btn"
            title="Toggle Auto Day Cycle (Space)"
            data-tooltip="Auto Cycle (Space)"
            aria-label="Toggle Auto Day Cycle"
          >
            <svg id="icon-play" viewBox="0 0 24 24" width="13" height="13">
              <polygon points="7,5 19,12 7,19" fill="currentColor" />
            </svg>
            <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" width="13" height="13">
              <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" />
              <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" />
            </svg>
          </button>

          <div class="tod-presets" id="tod-presets">
            <button class="tod-btn" data-mode="dawn" title="Dawn (1)">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M17 18a5 5 0 0 0-10 0" />
                <line x1="12" y1="9" x2="12" y2="5" />
                <line x1="4.22" y1="10.22" x2="5.64" y2="11.64" />
                <line x1="19.78" y1="10.22" x2="18.36" y2="11.64" />
                <line x1="2" y1="18" x2="22" y2="18" />
              </svg>
              <span>DAWN</span>
            </button>

            <button class="tod-btn active" data-mode="day" title="Midday (2)">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7">
                <circle cx="12" cy="12" r="4.5" />
                <line x1="12" y1="2.5" x2="12" y2="5" />
                <line x1="12" y1="19" x2="12" y2="21.5" />
                <line x1="4.22" y1="4.22" x2="6.0" y2="6.0" />
                <line x1="18.0" y1="18.0" x2="19.78" y2="19.78" />
                <line x1="2.5" y1="12" x2="5" y2="12" />
                <line x1="19" y1="12" x2="21.5" y2="12" />
                <line x1="4.22" y1="19.78" x2="6.0" y2="18.0" />
                <line x1="18.0" y1="6.0" x2="19.78" y2="4.22" />
              </svg>
              <span>DAY</span>
            </button>

            <button class="tod-btn" data-mode="golden" title="Golden Hour (3)">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7">
                <circle cx="12" cy="14" r="4.5" />
                <line x1="2" y1="19" x2="22" y2="19" />
                <line x1="5" y1="22" x2="19" y2="22" opacity="0.6" />
                <line x1="12" y1="5" x2="12" y2="7.5" />
                <line x1="5.5" y1="8.5" x2="7.3" y2="10.3" />
                <line x1="18.5" y1="8.5" x2="16.7" y2="10.3" />
              </svg>
              <span>GOLDEN</span>
            </button>

            <button class="tod-btn" data-mode="dusk" title="Blue Hour / Dusk (4)">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M18 15.5A6.5 6.5 0 0 1 9.5 7a6.5 6.5 0 1 0 8.5 8.5Z" />
                <line x1="3" y1="20" x2="21" y2="20" opacity="0.6" />
              </svg>
              <span>DUSK</span>
            </button>

            <button class="tod-btn" data-mode="night" title="Starlit Night (5)">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M20.5 14.5A8 8 0 0 1 9.5 3.5a8 8 0 1 0 11 11Z" />
                <circle cx="18" cy="6" r="1" fill="currentColor" />
                <circle cx="14" cy="4" r="0.7" fill="currentColor" />
              </svg>
              <span>NIGHT</span>
            </button>
          </div>

          <div class="tod-slider-wrap">
            <input
              id="tod-slider"
              type="range"
              min="0"
              max="1000"
              value="260"
              class="tod-slider"
              aria-label="Time of Day Scrub"
            />
          </div>

          <button
            id="btn-places"
            class="places-trigger-btn"
            title="Camera Vistas &amp; Places"
            aria-label="Toggle Camera Places"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z" />
              <circle cx="12" cy="11" r="2.2" />
            </svg>
            <span>Places</span>
          </button>
        </div>
      </nav>

      <!-- Top-right Icon-Only Utility Controls with Tooltips -->
      <aside class="ui-tools glass-panel">
        <button
          id="btn-sound"
          class="tool-btn"
          title="Ambient Sound: Mute (M)"
          data-tooltip="Sound: Mute (M)"
          aria-label="Sound"
        >
          <svg id="icon-sound-off" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <line x1="22" y1="9" x2="16" y2="15" />
            <line x1="16" y1="9" x2="22" y2="15" />
          </svg>
          <svg id="icon-sound-on" class="hidden" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
        </button>

        <button
          id="btn-weather"
          class="tool-btn"
          title="Weather: Clear (W)"
          data-tooltip="Weather: Clear (W)"
          aria-label="Weather"
        >
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" />
          </svg>
        </button>

        <button
          id="btn-quality"
          class="tool-btn active"
          title="Graphics Quality: High (Q)"
          data-tooltip="Quality: High (Q)"
          aria-label="Quality"
        >
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
          </svg>
        </button>

        <button
          id="btn-wander"
          class="tool-btn"
          title="Wander / Photo Mode (P)"
          data-tooltip="Wander Mode (P)"
          aria-label="Wander Mode"
        >
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </button>

        <button
          id="btn-fullscreen"
          class="tool-btn"
          title="Fullscreen (F)"
          data-tooltip="Fullscreen (F)"
          aria-label="Fullscreen"
        >
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
          </svg>
        </button>
      </aside>
    </div>

    <!-- Subtle Photo Mode Exit Pill -->
    <button id="photo-exit-pill" class="photo-exit-pill hidden">
      <span>WANDER MODE · PRESS ESC OR CLICK TO RESTORE UI</span>
    </button>

  </body>
</html>
